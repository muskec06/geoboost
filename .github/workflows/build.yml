name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/GeoBoost/server | Out-Null
          Copy-Item target/release/geoboost.exe, README.md, LICENSE dist/GeoBoost/
          Copy-Item server/* dist/GeoBoost/server/
          Compress-Archive -Path dist/GeoBoost -DestinationPath dist/GeoBoost-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GeoBoost-windows-x64
          path: dist/GeoBoost-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeoBoost-windows-x64.zip
          generate_release_notes: true
